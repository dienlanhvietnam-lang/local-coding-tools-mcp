<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI Fixture</title>
  <style>
    :root { --primary: #2563eb; --text: #111827; }
    body { font-family: system-ui, sans-serif; margin: 2rem; color: var(--text); }
    h1 { font-size: 2rem; }
    .card { padding: 1rem; border: 1px solid #e5e7eb; border-radius: 8px; }
    button { background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <h1>Sample UI</h1>
  <p class="card">Fixture for MCP UI design tools.</p>
  <button type="button">Get started</button>
</body>
</html>

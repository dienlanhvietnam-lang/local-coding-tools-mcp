name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  release-gate:
    name: Release gate (Windows / Node 24)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        continue-on-error: false

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Smoke
        run: npm run smoke

      - name: Verify artifacts
        run: npm run verify

      - name: Verify image-core profile
        run: npm run verify:image-core

      - name: Full-image dependency report (non-blocking)
        run: node scripts/check-image-deps.mjs --profile full-image --json
        continue-on-error: true

      - name: Release customer pack
        run: npm run release:customer

      - name: Verify customer ZIP (clean extract)
        run: npm run verify:customer-zip

      - name: Release gate
        run: npm run release:gate

      - name: Upload customer pack artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: customer-pack
          retention-days: 14
          path: |
            release/local-coding-tools-mcp-v*-customer.zip
            release/SHA256SUMS.txt
            release/release-gate-result.json

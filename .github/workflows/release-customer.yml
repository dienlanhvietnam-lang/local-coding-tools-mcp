name: Release Customer ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build MCP server
        run: npm ci && npm run build

      - name: Package customer ZIP
        shell: pwsh
        run: |
          ./scripts/package-customer-zip.ps1 -Version "${{ github.ref_name }}"
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $zip = "release/local-coding-tools-mcp-v${ver}-customer.zip"
          if (-not (Test-Path $zip)) { throw "ZIP not found: $zip" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          @(
            "# local-coding-tools-mcp customer pack checksums",
            "# Generated: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')",
            "# Version: $ver",
            "$hash  local-coding-tools-mcp-v${ver}-customer.zip"
          ) | Set-Content release/SHA256SUMS.txt -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/local-coding-tools-mcp-v*-customer.zip
          generate_release_notes: true
